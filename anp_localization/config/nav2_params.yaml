global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 5.0

      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.302, 0.1263], [0.1263, 0.302], [-0.1263, 0.302], [-0.302, 0.1263], [-0.302, -0.1263], [-0.1263, -0.302], [0.1263, -0.302], [0.302, -0.1263]]"
      footprint_padding: 0.01

      rolling_window: false

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true

          obstacle_min_range: 0.1
          obstacle_max_range: 11.5

          raytrace_min_range: 0.1
          raytrace_max_range: 11.8

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        inflation_radius: 0.5
        cost_scaling_factor: 0.3

      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 10.0
      publish_frequency: 10.0

      rolling_window: true

      footprint: "[[0.302, 0.1263], [0.1263, 0.302], [-0.1263, 0.302], [-0.302, 0.1263], [-0.302, -0.1263], [-0.1263, -0.302], [0.1263, -0.302], [0.302, -0.1263]]"
      footprint_padding: 0.01

      width: 5
      height: 5
      resolution: 0.05

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true

          obstacle_min_range: 0.1
          obstacle_max_range: 11.5

          raytrace_min_range: 0.1
          raytrace_max_range: 11.8

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        inflation_radius: 0.5
        cost_scaling_factor: 0.3

      always_send_full_costmap: true


planner_server:
  ros__parameters:

    use_sim_time: true

    costmap_update_timeout: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:

    use_sim_time: true

    costmap_update_timeout: 0.3
    failure_tolerance: 0.3

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.5

      min_vel_y: 0.0
      max_vel_y: 0.0

      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.7

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2

      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.1

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.1
      
      ObstacleFootprint.scale: 1.0
      BaseObstacle.scale: 2.0

      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1

      PathDist.scale: 16.0
      GoalDist.scale: 16.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /diff_drive_controller/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

