controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_front_left_wheel_joint"]
    right_wheel_names: ["base_front_right_wheel_joint"]
    
    cmd_vel_timeout: 2.0
    wheel_separation: 0.36
    wheel_radius: 0.1
    wheel_separation_multiplier: 1.8

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    velocity_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: true
    publish_rate: 50.0
    
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
